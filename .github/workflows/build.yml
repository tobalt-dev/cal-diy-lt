name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned upstream ref
        id: ref
        run: |
          ref="$(tr -d '[:space:]' < UPSTREAM_REF)"
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
          echo "short=${ref:0:12}" >> "$GITHUB_OUTPUT"
          echo "build=${ref:0:12}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: ${{ steps.ref.outputs.sha }}
          path: upstream

      - name: Apply overlay
        run: python3 scripts/apply-overlay.py overlay upstream

      - name: i18n placeholders match English
        run: python3 scripts/i18n-drift.py upstream overlay/packages/i18n/locales/lt/common.json

      # The Next.js build needs ~6 GB heap and the image is ~9 GB; default runner disk is too small.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://meet.tobalt.lt
            CALCOM_TELEMETRY_DISABLED=1
            MAX_OLD_SPACE_SIZE=6144
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ref.outputs.build }}
            ghcr.io/${{ github.repository }}:latest
